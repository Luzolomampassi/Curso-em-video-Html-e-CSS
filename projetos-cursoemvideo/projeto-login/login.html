<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/style.css">
    <script src="https://kit.fontawesome.com/f6a9b3f1e7.js" crossorigin="anonymous"></script>
    <title>Login</title>
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">
                
            </div>

            <div id="formulario">
                <h1>Login</h1>
                <p>Seja bem-vindo(a) novamente. Faça login para acessar a sua conta e poder fazer as configurações no seu ambiente</p>
                <form action="login.php" method="post">
                    <div class="campo">
                        <i class="fa-solid fa-user fa-xl icone"></i>
                        <input type="email" name="login" id="ilogin" placeholder="seu e-mail"  autocomplete="email" required>
                        <label for="ilogin">Login</label>
                    </div>
                    <div class="campo">
                        <i class="fa-solid fa-key fa-xl icone"></i>
                        <input type="password" name="senha" id="senha" placeholder="sua senha" autocomplete="current-password" required minlength="8" maxlength="30">
                        <label for="senha">Senha</label>

                    </div>
                    <div>
                        <input type="submit" value="Entrar">
                        <a href="#" class="botao">Esqueci a senha</a>
                    </div>
                    
                </form>
            </div>

        </section>
    </main>
    
</body>
</html>
