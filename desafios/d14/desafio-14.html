<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        table{border-collapse: collapse;width: 300px;}
        td,th{padding: 12px;border: 1px solid black;}
        th{background-color: rgb(123, 123, 123);color: white ;}
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th rowspan="2">Área</th>
                <th rowspan="2">Disciplinas</th>
                <th colspan="2">Notas</th>
                <th rowspan="2">Média</th>
            </tr>
            <tr>
                <th>Nota1</th>
                <th>Nota2</th>
            </tr>
           
        </thead>
        <tbody>
             <tr>
                 <td  rowspan="4"><strong>Exatas</strong></td>
                 <td>Matematica</td>
                 <td>0.0</td>
                 <td>0.0</td>
                 <td>0.0</td>
                 
             </tr>
             <tr>
                <td>Fisica</td>
                 <td>0.0</td>
                 <td>0.0</td>
                 <td>0.0</td>
            </tr>
             <tr>
                <td>Quimica</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <th colspan="4">Media de exatas</th>
            <th>0.0</th>
            <tr>
                <td rowspan="2"><strong>Humanas</strong></td>
                <td>Historia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <th colspan="4">Média de Humanas</th>
            <th>0.0</th>
        </tbody>
    </table>
    
</body>
</html>
