<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        .container{
            display: flex;
            background-color: lightsalmon;
            flex-flow: row wrap;
        }
        .item{
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            padding: 20px;

        }
        #i1{
            order: 0;
        }
        #i2{
            order: -2;
        }
        #i3{
            order: 4;
        }
        #i4{
            order: 8;
        }
        #i5{
            order: 2;
        }
        #i6{
            order: 0;
        }
        #i7{
            order: -4;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">A1</div>
        <div class="item" id="i2">B2</div>
        <div class="item" id="i3">C3</div>
        <div class="item" id="i4">D4</div>
        <div class="item" id="i5">E5</div>
        <div class="item" id="i6">F6</div>
        <div class="item" id="i7">G7</div>

    </div>
    
</body>
</html>
