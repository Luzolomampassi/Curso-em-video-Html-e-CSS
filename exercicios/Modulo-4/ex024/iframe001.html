<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe{border: 1px solid black;
        width: 400px;height: 400px;}
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>Acessando o site do 
        
        <iframe src="https://www.wikipedia.org" frameborder="0" width="300px">
           <a href="https://www.wikipedia.org" target="_blank">wikipedia</a>
        </iframe>
        
        
    curso em vídeo para aprender a programar.</p>
    <p>O repositório do  Guanabara
        
        <iframe src="https://gustavoguanabara.github.io" frameborder="0">
            <a href="https://gustavoguanabara.github.io" target="_blank">O repositório GIthub</a>
        </iframe>

    também é bem legal</p>
</body>
</html>
